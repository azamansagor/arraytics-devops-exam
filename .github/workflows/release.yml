# Exam token: root-vmi3536696-1788597274-30dab396
#
# Main-branch pipeline: build the image once, publish it to GitHub Container
# Registry, then - after a human approves - roll the VPS Swarm service onto it.
# This is the registry the stack in B4 pulls from, so what CI publishes is
# literally what runs.
#
# There are no static credentials for the registry. GITHUB_TOKEN is minted for
# this run, scoped by the permissions block below, and expires when the job ends.
# The AWS pipeline in deploy.yml made the same guarantee a different way, through
# OIDC. The VPS deploy key is the one long-lived secret here, and it is fenced -
# see the deploy-vps job.

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Safeguard 1 (Task 46): one publish at a time. Two pushes landing together would
# otherwise race to move the `latest` tag, and whichever finished last would win -
# not necessarily the newer commit. Queueing makes the last commit win.
# cancel-in-progress stays false: a half-pushed manifest is worse than a slow queue.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/notes-api-zaman

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Safeguard 2 (Task 46): a wedged build cannot hold the concurrency lock until
    # GitHub's six-hour default and block every later release behind it.
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write # the only extra right this job gets

    steps:
      - name: Show exam token and time
        run: echo "root-vmi3536696-1788597274-30dab396 | $(date)"

      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Three tags on one build, as Task 43 asks for.
      #
      # The SHA tag is the one that matters operationally: it is unambiguous, so a
      # running container can always be traced back to the exact commit. The version
      # tag is for humans reading a changelog. `latest` is a convenience pointer and
      # is deliberately not what the Swarm stack pins to - a service that follows
      # `latest` has no way to tell you which build it is running, and no way back.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: scenario-b/app
          file: scenario-b/docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:v1.1.${{ github.run_number }}
            ${{ env.IMAGE }}:latest
          # Task 42. First attempt used type=gha, GitHub's own cache backend. It
          # produced no cache hits at all on the warm run - searching that run's
          # build log for CACHED returns nothing - while still paying to export,
          # so the build went from 7s to 14s. Configured caching that silently
          # restores nothing is worse than none.
          #
          # Registry cache instead: the cache is written to GHCR as its own tag,
          # alongside the image. It is visible in the Packages tab, so whether a
          # cache exists is a fact rather than an assumption, and it uses the
          # registry credentials this job already holds.
          #
          # mode=max because this is a multi-stage build: mode=min would export
          # only the final stage and drop the npm ci layer, which is the one layer
          # actually worth caching.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Report what was published
        run: |
          echo "root-vmi3536696-1788597274-30dab396 | $(date)"
          echo "pushed:"
          echo "  ${{ env.IMAGE }}:${{ github.sha }}"
          echo "  ${{ env.IMAGE }}:v1.1.${{ github.run_number }}"
          echo "  ${{ env.IMAGE }}:latest"

  # ---------------------------------------------------------------------------
  # Task 44 - deploy to the VPS Swarm, behind an approval gate.
  #
  # `environment:` is what creates the gate. The environment has a required
  # reviewer, so this job does not start when build-and-push finishes - it waits
  # at "Review pending deployments" until a human approves it. The build has
  # already happened, so nothing is lost by waiting, and what gets approved is a
  # specific image that exists rather than a promise to build one.
  #
  # The deploy key is the one long-lived secret in this repository, so it is
  # fenced on the far side: authorized_keys pins it to a forced command
  # (scenario-b/deploy/zaman-deploy.sh) with no pty and no forwarding. The key
  # cannot open a shell, read a file, or touch any service but zaman_notes_app -
  # which matters on a VPS shared with six other candidates.
  # ---------------------------------------------------------------------------
  deploy-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: production-vps
      url: http://169.58.246.108:3111/healthz

    steps:
      - name: Show exam token and time
        run: echo "root-vmi3536696-1788597274-30dab396 | $(date)"

      - name: Deploy to the Swarm service over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SHA: ${{ github.sha }}
        run: |
          install -d -m 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Trust on first use. Pinning the host key as a secret would be
          # stricter, since keyscan believes whatever answers on port 22 - but
          # the forced command on the far side means a wrong host would receive
          # a commit sha and nothing else, so the exposure is one public string.
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # The sha is the entire payload. This side cannot name a service, an
          # image, or a command - the far side decides all three.
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" "$SHA"

      - name: Report what was deployed
        run: |
          echo "root-vmi3536696-1788597274-30dab396 | $(date)"
          echo "deployed ${{ env.IMAGE }}:${{ github.sha }}"
